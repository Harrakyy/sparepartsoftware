; php.ini untuk Verifikasi Faktur (edisi offline, Apache module).
; __PHP_DIR__ diganti setup-master.ps1 dengan folder PHP yang terpasang (path absolut wajib untuk
; modul Apache: path relatif dihitung dari folder kerja httpd, bukan folder PHP).

[PHP]
engine = On
expose_php = Off
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 20M
post_max_size = 25M
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
default_charset = "UTF-8"

extension_dir = "__PHP_DIR__\ext"
extension = fileinfo
extension = mbstring
extension = openssl
extension = pdo_sqlite
extension = sqlite3
extension = sodium

zend_extension = opcache

[Date]
date.timezone = Asia/Jakarta

[Session]
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
