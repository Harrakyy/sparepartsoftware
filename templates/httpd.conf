# httpd.conf Verifikasi Faktur - dibuat setup-master.ps1 dari template ini (placeholder diganti saat pasang).
# Minimal: hanya modul yang dibutuhkan Laravel; tanpa listing folder; versi server disembunyikan.

ServerRoot "__SERVER_ROOT__"
Listen __PORT__
ServerName localhost:__PORT__
ServerTokens Prod
ServerSignature Off

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so

LoadModule php_module "__PHP_DIR__/php8apache2_4.dll"
PHPIniDir "__PHP_DIR__"

# Windows: matikan AcceptFilter supaya koneksi dari komputer scan tidak menggantung.
AcceptFilter http none
AcceptFilter https none

DocumentRoot "__APP_PUBLIC__"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "__APP_PUBLIC__">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Files ".ht*">
    Require all denied
</Files>

DirectoryIndex index.php index.html
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

TypesConfig conf/mime.types
AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json

# Unggah PDF faktur sampai 20 MB (sejalan dengan php.ini post_max_size 25M).
LimitRequestBody 26214400

ErrorLog "logs/error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access.log" common
